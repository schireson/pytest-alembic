name: CI
on:
  # Branches only. Tag pushes reach this workflow through release.yml, which
  # calls it via workflow_call so that publishing waits on a green matrix; a
  # bare `push:` would additionally run the matrix a second time on the tag.
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:
    inputs:
      working-directory:
        # Already referenced by the Coveralls flag name below. Declared with an
        # empty default so the reference stays valid now that this workflow has
        # a real input schema, and resolves to the same value it always did.
        description: Optional label fragment for the Coveralls flag name.
        type: string
        required: false
        default: ""

# Least privilege for every job below. A pinned action is only half the answer:
# pinning fixes *which* third-party code runs, this fixes what that code is
# allowed to do. Nothing in this workflow writes to the repository — the tests
# read the tree, and Coveralls uses GITHUB_TOKEN only to identify the build — so
# read is the whole requirement. The release workflow grants its own narrower
# writes on the jobs that need them.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    services:
      postgres:
        image: postgres:11.12
        env:
          POSTGRES_DB: dev
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    runs-on: ubuntu-latest
    # `uv run` re-syncs the environment to uv.lock before executing, which silently
    # reverts the pins installed below -- including from `make lint`, which runs first.
    # This makes every `uv run` in the job use the environment as-is. `uv sync` in
    # `make install` is unaffected, so the environment is still fully populated.
    env:
      UV_NO_SYNC: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every version here is applied with `==`, not `~=`, and the job runs with
          # UV_NO_SYNC so `uv run` cannot revert it. Both matter: `~=2.0.40` means
          # ">=2.0.40, ==2.0.*", which resolves to the newest 2.0.x and so pins nothing,
          # and a plain `uv run` re-syncs to uv.lock and reinstalls the locked version.
          # Read the `platform ... pytest-X.Y.Z` banner in the log to confirm what ran.

          # Sweep across python versions at the highest checked dependency versions.
          # Older tool versions are tested separately below on a single interpreter
          # since we have no reason to believe interpreter-specific breakage would
          # surface in those older versions but not in the newest,
          # but we **do** know that newer versions of dependencies may not support arbitrarily old
          # python versions.
          - {python-version: "3.10", pytest-version: "9.1.1", sqlalchemy-version: "2.0.52"}
          - {python-version: "3.11", pytest-version: "9.1.1", sqlalchemy-version: "2.0.52"}
          - {python-version: "3.12", pytest-version: "9.1.1", sqlalchemy-version: "2.0.52"}
          - {python-version: "3.13", pytest-version: "9.1.1", sqlalchemy-version: "2.0.52"}
          - {python-version: "3.14", pytest-version: "9.1.1", sqlalchemy-version: "2.0.52"}
          - {python-version: "3.15", pytest-version: "9.1.1", sqlalchemy-version: "2.0.52"}

          # For older tool versions, we can just stick to a single python version, again, because we
          # have no reason to believe their pytest-alembic specifically impacts their compatibility.
          # pytest 7.0.0 is the floor declared in [project.dependencies]; 8.3.5 covers
          # the intervening major, whose hook API differs from both neighbours.
          # sqlalchemy 2.0.40 is the oldest checked version. It is paired only with 3.13
          # because it publishes no cp314/cp315 wheels, and running the pure-python
          # fallback there would test the fallback rather than the version.
          - {python-version: "3.13", pytest-version: "7.0.0", sqlalchemy-version: "2.0.40"}
          - {python-version: "3.13", pytest-version: "8.3.5", sqlalchemy-version: "2.0.40"}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: make install

      - name: Install specific versions
        run: |
          uv pip install 'sqlalchemy==${{ matrix.sqlalchemy-version }}'
          uv pip install 'pytest==${{ matrix.pytest-version }}'

      - name: Run linters
        run: make lint

      - name: Run tests
        run: make test

      - name: Store test result artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ runner.os }}-${{ matrix.python-version }}-${{ matrix.pytest-version }}-${{ matrix.sqlalchemy-version }}
          path: coverage.xml

      - name: Coveralls
        env:
          COVERALLS_FLAG_NAME: run-${{ inputs.working-directory }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_PARALLEL: true
        run: |
          uv pip install tomli coveralls
          uv run coveralls --service=github

  audit:
    # Dependency vulnerability scan. Deliberately outside the test matrix and
    # with no `needs:` — the lockfile is identical for every matrix entry, so
    # auditing it 20 times would report the same answer 20 times.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"

      - name: Audit runtime dependencies
        run: make audit

      - name: Audit dev and docs dependencies
        # Gating, not informational. This was `continue-on-error` while the docs group
        # reached mistune 0.8.4 through m2r2, which pinned it exactly and so could not be
        # resolved. m2r2 has been replaced by myst-parser, the whole lockfile is clean,
        # and a new advisory in the dev or docs groups should fail the build rather than
        # be reported into a log nobody reads.
        run: make audit-all

  pre-commit:
    # The hook config, as a gate. A `.pre-commit-config.yaml` no job invokes is a file
    # rather than a gate -- it rots silently, and the first person to run
    # `pre-commit install` finds out. Outside the test matrix for the reason `audit`
    # and `docs-coverage` document below: the answer does not vary by matrix entry.
    #
    # This deliberately overlaps `make lint`, which is the check-only form of the same
    # tools and gates every matrix entry. What is verified here is that the hooks
    # themselves still resolve and run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: make install

      - name: Run the pre-commit hooks
        run: uvx pre-commit run --all-files --show-diff-on-failure

  docs-coverage:
    # Docstring coverage. Outside the test matrix for the same reason the audit job
    # documents above: the answer is identical for every matrix entry, so running it
    # 20 times would report the same number 20 times. Unlike `audit`, this one needs
    # the dev group installed, since interrogate is a declared dependency rather than
    # a `uvx` download.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: make install

      - name: Check docstring coverage
        run: make docs-coverage

  deps:
    # Dependency hygiene: an import with no declaration, or a declaration with no
    # import. Outside the test matrix for the reason `audit` and `docs-coverage`
    # document above -- the answer comes from `pyproject.toml` and `src`, neither of
    # which varies by matrix entry.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: make install

      - name: Check dependency hygiene
        run: make deps

  docs:
    # The documentation build, as a gate. Outside the test matrix for the same
    # reason `audit` and `docs-coverage` document above: the .rst sources do not
    # vary by matrix entry. Until this existed, the only thing that ever built
    # these docs was readthedocs, *after* the merge — so a broken cross-reference
    # was reported by a third-party service in a post-merge email rather than by
    # the pull request that introduced it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: make install

      - name: Build the documentation
        run: make docs

  finish:
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install tomli coveralls
          coveralls --service=github --finish
