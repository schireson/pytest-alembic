name: CI
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    services:
      postgres:
        image: postgres:11.12
        env:
          POSTGRES_DB: dev
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        pytest-version: ["7.0.0", "8.3.5"]
        pytest-asyncio-version: ["0.16.0", "0.23.0"]
        sqlalchemy-version: ["2.0.40"]

        exclude:
          # old versions of pytest-asyncio use old pytest hook syntax
          - pytest-version: "8.3.5"
            pytest-asyncio-version: "0.16.0"

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: make install

      - name: Install specific versions
        run: |
          uv pip install 'sqlalchemy~=${{ matrix.sqlalchemy-version }}'
          uv pip install 'pytest~=${{ matrix.pytest-version }}'
          uv pip install 'pytest-asyncio~=${{ matrix.pytest-asyncio-version }}'

      - name: Run linters
        run: make lint

      - name: Run tests
        run: make test

      - name: Store test result artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ runner.os }}-${{ matrix.python-version }}-${{ matrix.pytest-version }}-${{ matrix.pytest-asyncio-version }}-${{ matrix.sqlalchemy-version }}
          path: coverage.xml

      - name: Coveralls
        env:
          COVERALLS_FLAG_NAME: run-${{ inputs.working-directory }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_PARALLEL: true
        run: |
          uv pip install tomli coveralls
          uv run coveralls --service=github

  finish:
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install tomli coveralls
          coveralls --service=github --finish
