[project]
name = "pytest-alembic"
version = "0.12.1"
description = "A pytest plugin for verifying alembic migrations."
authors = [{ name = "Dan Cardin", email = "ddcardin@gmail.com" }]
license = { text = "MIT" }
keywords = ["pytest", "sqlalchemy", "alembic", "migration", "revision"]
classifiers = ["Framework :: Pytest"]
readme = "README.md"
requires-python = ">=3.9,<4"
dependencies = ["pytest>=7.0", "alembic", "sqlalchemy"]

[project.urls]
repository = "https://github.com/schireson/pytest-alembic"

[project.entry-points.pytest11]
pytest_alembic = "pytest_alembic.plugin"

[build-system]
requires = ["uv_build>=0.6,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asyncpg",
    "coverage[toml]>=6.4.4",
    "greenlet>=3.0",
    "mypy>=1.11",
    "psycopg2-binary",
    "pytest>=8.3.2",
    "pytest-asyncio",
    "pytest-mock-resources[docker]>=2.6.3",
    "ruff>=0.15.0",
    "sqlalchemy[asyncio]>=2.0.42",
    "types-dataclasses>=0.1.7,<0.7",
    "anyio",
]
docs = ["m2r2", "sphinx", "sphinx-rtd-theme", "sphinx-autodoc-typehints", "sphinx-autobuild"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Ratcheted floor. Held below the ~95% actually observed locally, because the CI
# matrix skips the asyncio tests on sqlalchemy versions without asyncio support,
# which legitimately lowers coverage on those entries.
fail_under = 93
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py37"
line-length = 100

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C",
    "D",
    "E",
    "F",
    "G",
    "I",
    "N",
    "Q",
    "S",
    "T",
    "W",
    "ARG",
    "BLE",
    "DJ",
    "DTZ",
    "EM",
    "ERA",
    "EXE",
    "FBT",
    "ICN",
    "INP",
    "ISC",
    "NPY",
    "PD",
    "PGH",
    "PIE",
    "PT",
    "PTH",
    "PYI",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "SLF",
    "TCH",
    "TID",
    "TRY",
    "UP",
    "YTT",
]
ignore = ["E501", "S101", "D1", "B904", "B007", "B904"]

[tool.ruff.lint.isort]
order-by-type = false

[tool.ruff.lint.per-file-ignores]
"src/pytest_alembic/tests/**/*.py" = ["S101", "BLE001"]
"**/tests/**/*.py" = ["D", "S", "N801", "N802", "N806", "T201", "E501"]
"examples/**/*.py" = ["INP001", "A", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
source = ["src"]
branch = true
parallel = true

[tool.pytest.ini_options]
doctest_optionflags = "NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL ELLIPSIS"
addopts = "--doctest-modules -vv --ff --strict-markers"
asyncio_default_fixture_loop_scope = "function"
pytest_alembic_exclude = 'up_down_consistency'
norecursedirs = ".* build dist *.egg"
pytester_example_dir = "examples"
filterwarnings = [
    "error",
    "default:.*which short-circuited the downgrade operation and may have passed the test.*:UserWarning",
    "ignore:unclosed <socket.socket.*:ResourceWarning",
    "ignore:unclosed transport.*:ResourceWarning",
    "ignore:unclosed connection.*:ResourceWarning",
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
    "ignore:.*is deprecated and will be removed in Python 3.14.*:DeprecationWarning",
    "ignore:.*asyncio_default_fixture_loop_scope.*:pytest.PytestDeprecationWarning",
]

[tool.mypy]
strict_optional = true
ignore_missing_imports = true
warn_unused_ignores = true
incremental = true

[tool.interrogate]
# Docstring *coverage*, as a ratchet. This deliberately complements ruff rather
# than duplicating it: `D1` is ignored under [tool.ruff.lint], so no individual
# symbol is required to carry a docstring, while this floor stops the overall
# proportion from regressing. Public API first, internals as they are touched.
#
# Ratcheted floor, in the same spirit as [tool.coverage.report]. Held just below
# the 45.0% observed locally so an unrelated refactor that adds an undocumented
# helper does not redden the build; raise it whenever the measured number moves up.
fail-under = 44

# Re-export modules (`__init__.py`) hold only imports and `__all__`; magic
# methods and nested helpers are not a documentation surface. `ignore-init-method`
# is intentionally absent: it is mutually exclusive with `style = "google"`, where
# the class docstring is what documents `__init__`.
ignore-init-module = true
ignore-magic = true
ignore-nested-functions = true
ignore-private = true
ignore-semiprivate = true

# Note: ignore-property-decorators / ignore-setters / ignore-overloaded-functions
# are deliberately left off — this project's properties *are* documented, so
# excluding them would drop them from the numerator and lower the score.

# Honour the google convention already configured in [tool.ruff.lint.pydocstyle].
style = "google"

exclude = ["tests", "examples", "docs", "build", "dist", ".venv"]
omit-covered-files = false
verbose = 1
